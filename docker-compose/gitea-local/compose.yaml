name: gitea.local

services:
  gitea:
    container_name: gitea
    image: gitea/gitea:1.25
    restart: unless-stopped
    environment:
      # default
      - USER_UID=${GITEA_UID}
      - USER_GID=${GITEA_GID}
      # database
      - GITEA__database__DB_TYPE=mysql
      - GITEA__database__HOST=${GITEA_DB_HOST}
      - GITEA__database__NAME=${GITEA_DB_NAME}
      - GITEA__database__USER=${GITEA_DB_USER}
      - GITEA__database__PASSWD=${GITEA_DB_PASS}
      # security
      - GITEA__security__SECRET_KEY=${GITEA_SECRET_KEY}
      - GITEA__security__INTERNAL_TOKEN=${GITEA_SECRET_INTR}
      # service
      - GITEA__service__DISABLE_REGISTRATION=${GITEA_DISABLE_REG}
      # server
      - GITEA__server__ROOT_URL=${GITEA_ROOT_URL}
      - GITEA__server__SSH_PORT=${GITEA_SSH_P}
      - GITEA__server__SSH_LISTEN_PORT=${GITEA_SSH_LP}
      # mailer
      #- GITEA__mailer__ENABLED=${GITEA_MAIL_ENABLED}
      #- GITEA__mailer__SMTP_ADDR=${GITEA_SMTP_ADDR}
      #- GITEA__mailer__SMTP_PORT=${GITEA_SMTP_PORT}
      #- GITEA__mailer__FROM=${GITEA_MAIL_FROM}
      #- GITEA__mailer__PROTOCOL=${GITEA_MAIL_PROTOCOL}
      #- GITEA__mailer__PASSWD=${GITEA_MAIL_API}
      # other
      - GITEA__OTHER__SHOW_FOOTER_VERSION=${GITEA_SHOW}
      - GITEA__OTHER__SHOW_FOOTER_TEMPLATE_LOAD_TIME=${GITEA_SHOW}
      - GITEA__OTHER__SHOW_FOOTER_POWERED_BY=${GITEA_SHOW}
      # log
      - GITEA__LOG__ENABLE_SSH_LOG=${GITEA_SSH_LOG_EN}
      - GITEA__LOG__LEVEL=${GITEA_LOG_LEVEL}
      # cache
      - GITEA__cache__ENABLED=true
      - GITEA__cache__ADAPTER=redis
      - GITEA__cache__HOST=${GITEA_CACHE_HOST}
      - GITEA__cache__ITEM_TTL=24h
    ports:
      - ${GITEA_SSH_P}:${GITEA_SSH_LP}
    volumes:
      - ./gitea/data:/data
      - /etc/localtime:/etc/localtime:ro
    networks:
      - custom
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
  db:
    container_name: gitea-db
    restart: unless-stopped
    image: mysql:9
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_USER=${GITEA_DB_USER}
      - MYSQL_PASSWORD=${GITEA_DB_PASS}
      - MYSQL_DATABASE=${GITEA_DB_NAME}
    healthcheck:
      test:
        - CMD
        - mysqladmin
        - ping
        - -h
        - localhost
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - /opt/gitea/mysql-data:/var/lib/mysql
    networks:
      - custom
  redis:
    image: redis:alpine
    restart: unless-stopped
    container_name: gitea-redis
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 10s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 1m
    networks:
      - custom
    volumes:
      - ./redis:/data
    gitea-runner:
      image: gitea/runner:3
      container_name: gitea-runner
      restart: unless-stopped
    environment:
      - CONFIG_FILE=/config.yaml
      - GITEA_ROOT_URL=${GITEA_ROOT_URL}
      - GITEA_INSTANCE_URL=${GITEA_INSTANCE_URL}
      - GITEA_RUNNER_REGISTRATION_TOKEN=${GITEA_RUNNER_REGISTRATION_TOKEN}
      - GITEA_RUNNER_NAME=${GITEA_RUNNER_NAME}
      - GITEA_RUNNER_LABELS=${GITEA_RUNNER_LABELS}
    volumes:
      - ./config.yaml:/config.yaml
      - ./gitea/gitea-runner/cache:/cache
      - ./gitea/gitea-runner/data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - custom
    depends_on:
      db:
        condition: service_started
      gitea:
        condition: service_started
        restart: true

networks:
  custom:
    external: true
